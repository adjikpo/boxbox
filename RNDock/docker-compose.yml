version: '3.8'

# IMPORTANT: Remplacer [NOM_DU_PROJET] par le nom de votre projet (ex: MyApp)

services:
  # Frontend React Native + Expo
  expo:
    build: .
    image: expo-dev:latest
    working_dir: /app/[NOM_DU_PROJET]
    command: npx expo start --lan
    volumes:
      - ./:/app
      - expo_node_modules:/app/[NOM_DU_PROJET]/node_modules
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
      - "8081:8081"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - app-network

  # CLI pour commandes ponctuelles (npm install, etc.)
  cli:
    build: .
    image: expo-dev:latest
    working_dir: /app/[NOM_DU_PROJET]
    volumes:
      - ./:/app
      - expo_node_modules:/app/[NOM_DU_PROJET]/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - app-network

  # Service dedie a la creation de projet (sans volume node_modules)
  create:
    build: .
    image: expo-dev:latest
    working_dir: /app
    volumes:
      - ./:/app
    stdin_open: true
    tty: true
    networks:
      - app-network

volumes:
  expo_node_modules:

networks:
  app-network:
    driver: bridge
