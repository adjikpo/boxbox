version: '3.8'

services:
  # Frontend React Native + Expo
  expo:
    build: .
    image: expo-dev:latest
    working_dir: /app/LedgerTrack
    command: npx expo start --lan
    depends_on:
      - api
    volumes:
      - ./:/app
      - expo_node_modules:/app/LedgerTrack/node_modules
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
      - "8081:8081"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_PUBLIC_API_URL=http://192.168.1.27:4000
    stdin_open: true
    tty: true
    networks:
      - app-network

  # Backend API Node.js/Express
  api:
    build: ./api
    working_dir: /app
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - api_data:/app/data
    env_file:
      - ./api/.env
    ports:
      - "4000:4000"
    networks:
      - app-network
    restart: unless-stopped

  # CLI pour commandes ponctuelles
  cli:
    build: .
    image: expo-dev:latest
    working_dir: /app
    volumes:
      - ./:/app
      - expo_node_modules:/app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - app-network

volumes:
  expo_node_modules:
  api_node_modules:
  api_data:

networks:
  app-network:
    driver: bridge
