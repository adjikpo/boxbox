name: BoxBox CI

on:
  push:
    branches: [main, Lyon-Workspace]
  pull_request:
    branches: [main]

jobs:
  # VercelDock - Next.js lint + typecheck + build
  verceldock:
    name: VercelDock CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VercelDock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Create test Next.js app
        run: pnpm create next-app@latest testapp --typescript --tailwind --eslint --app --src-dir --use-pnpm
      - name: Lint
        run: cd testapp && pnpm lint
      - name: Typecheck
        run: cd testapp && pnpm tsc --noEmit
      - name: Build
        run: cd testapp && pnpm build

  # RNDock - Expo lint + typecheck
  rndock:
    name: RNDock CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RNDock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create test Expo app
        run: npx create-expo-app@latest testapp --template blank-typescript
      - name: Install
        run: cd testapp && npm install
      - name: Typecheck
        run: cd testapp && npx tsc --noEmit || true

  # DjangoDock - Validate setup script
  djangodock:
    name: DjangoDock CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck DjangoDock/setup.sh || true
      - name: Syntax check
        run: bash -n DjangoDock/setup.sh
