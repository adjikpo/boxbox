name: CI

on:
  push:
    branches: [main, Lyon-Workspace]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking VercelDock..."
          test -f VercelDock/docker-compose.yml
          test -f VercelDock/Dockerfile
          test -f VercelDock/Dockerfile.dev
          test -f VercelDock/Makefile
          test -f VercelDock/README.md

          echo "Checking RNDock..."
          test -f RNDock/docker-compose.yml
          test -f RNDock/Dockerfile
          test -f RNDock/Makefile
          test -f RNDock/README.md

          echo "Checking DjangoDock..."
          test -f DjangoDock/setup.sh
          test -f DjangoDock/README.md

          echo "Checking root files..."
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f boxbox.sh

          echo "All files present!"

      - name: Validate Makefiles syntax
        run: |
          make -n -f VercelDock/Makefile help 2>&1 || true
          make -n -f RNDock/Makefile help 2>&1 || true
          echo "Makefiles valid!"

      - name: Check boxbox.sh is executable
        run: test -x boxbox.sh

      - name: Validate docker-compose files
        run: |
          for f in VercelDock/docker-compose.yml RNDock/docker-compose.yml; do
            echo "Checking $f..."
            grep -qv "^version:" "$f" && echo "  No deprecated version key ✓" || echo "  WARNING: version key found"
          done

      - name: Check no deprecated version in compose files
        run: |
          ! grep -l "^version:" VercelDock/docker-compose.yml RNDock/docker-compose.yml 2>/dev/null || \
            (echo "ERROR: deprecated version key found" && exit 1)
