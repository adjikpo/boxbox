# IMPORTANT: Remplacer [NOM_DU_PROJET] par le nom de votre projet (ex: myapp)

services:
  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: [NOM_DU_PROJET]_web
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Supabase PostgreSQL Database
  supabase-db:
    image: supabase/postgres:15.6.1.120
    container_name: [NOM_DU_PROJET]_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supabase Studio (UI d'administration)
  studio:
    image: supabase/studio:20240101-8e4a094
    container_name: [NOM_DU_PROJET]_studio
    ports:
      - "3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: "Default Organization"
      DEFAULT_PROJECT_NAME: "[NOM_DU_PROJET]"
      SUPABASE_URL: http://localhost:3000
      SUPABASE_PUBLIC_URL: http://localhost:3000
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - full

  # CLI pour commandes ponctuelles (pnpm install, etc.)
  cli:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - app-network

  # Service dedie a la creation de projet (sans volume node_modules)
  create:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    networks:
      - app-network

  # Supabase Studio (profil "full")
  supabase-studio:
    image: supabase/studio:latest
    container_name: [NOM_DU_PROJET]_studio
    ports:
      - "3001:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-db:5432
      SUPABASE_URL: http://supabase-db:5432
      POSTGRES_PASSWORD: postgres
    depends_on:
      - supabase-db
    profiles:
      - full
    networks:
      - app-network

volumes:
  node_modules:
  supabase_data:

networks:
  app-network:
    driver: bridge
